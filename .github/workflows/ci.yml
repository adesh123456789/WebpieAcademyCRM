name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only values. Real secrets are injected via the deploy pipeline, never committed.
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-only-not-a-real-secret-do-not-reuse"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to CI database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and route tests
        run: npm test

      - name: Production build
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t webpie:ci .

      - name: Run container
        run: |
          docker run -d --name webpie \
            -p 3000:3000 \
            -e DATABASE_URL="file:/tmp/runtime.db" \
            -e JWT_SECRET="ci-only-not-a-real-secret-do-not-reuse" \
            -e NEXT_PUBLIC_APP_URL="http://localhost:3000" \
            webpie:ci

      - name: Wait for HTTP 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then echo "container is serving"; exit 0; fi
            sleep 3
          done
          echo "container did not serve HTTP 200 in time"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs webpie

      - name: Stop container
        if: always()
        run: docker rm -f webpie
